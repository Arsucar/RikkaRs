name: Bug Report
description: 报告 APP Bug 或崩溃
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 报告。请完整填写可复现信息；提交前请从日志、截图和录屏中移除 Token、密钥、Cookie、账号、对话内容及其他个人信息。
        Thanks for reporting a bug. Please provide reproducible details and redact all secrets and personal data before uploading attachments.

  - type: input
    id: app_version
    attributes:
      label: App 版本 | App version
      description: 可在“设置 → 关于”中查看；如为自定义构建请附 commit SHA。
      placeholder: 例如 v1.2.3 (123) / commit abc1234
    validations:
      required: true

  - type: dropdown
    id: build_source
    attributes:
      label: 构建来源 | Build source
      options:
        - GitHub Release
        - Nightly / GitHub Actions
        - F-Droid / 第三方商店
        - 自行构建 | Self-built
        - 其他 | Other
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android 版本 | Android version
      placeholder: 例如 Android 15 / API 35
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备型号 | Device model
      placeholder: 例如 Pixel 8 / SM-S9280
    validations:
      required: true

  - type: input
    id: rom
    attributes:
      label: ROM / 系统版本 | ROM / OS build
      placeholder: 例如 Pixel UI AP4A... / One UI 7 / HyperOS 2
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 | Steps to reproduce
      description: 请从干净启动或明确前置条件开始，逐步列出操作。
      placeholder: |
        前置条件：
        1. 打开 ...
        2. 点击 ...
        3. 观察到 ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 问题描述 / 实际行为 | Problem description / actual behavior
      description: 实际发生了什么？请包含完整错误提示，但务必脱敏。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为 | Expected behavior
      description: 正常情况下应该发生什么？
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: 复现率 | Reproducibility
      options:
        - 每次 (100%)
        - 经常 (约 75%)
        - 偶尔 (约 50%)
        - 很少 (低于 25%)
        - 仅发生一次
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志、截图或录屏 | Logs / screenshots / recordings
      description: |
        请粘贴最小必要日志或拖入附件。上传前删除 Token、API Key、Cookie、账号、设备标识、对话内容、服务地址等敏感信息；无法安全脱敏时请勿上传，并说明原因。
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息 | Additional context
      description: 网络环境、Provider/模型、最近配置变化、临时解决办法等；请勿包含敏感数据。
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 敏感信息检查 | Sensitive-data check
      options:
        - label: 我已检查正文及附件，确认不含 Token、密钥、Cookie、个人信息或未脱敏的对话内容。
          required: true
